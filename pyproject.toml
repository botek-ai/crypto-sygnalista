[project]
name = "crypto-sygnalista"
version = "0.1.0"
description = "Crypto signals tracker — RSI, MACD, EMA, Bollinger Bands"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.3.0",
    "pandas-ta>=0.3.14b",
    "apscheduler>=3.10.4",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-telegram-bot>=21.3",
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.11",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
