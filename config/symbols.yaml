# Koszyk walut podzielony na pule zmienności
# Strategia v2 scoring: sygnały na 4h, wyjścia sprawdzane na 1h

# Flat watchlist — wszystkie symbole z 3 pul
watchlist:
  # High volatility pool (trailing=1.3%, SL=2.5%, activation=+1%)
  - INJ/USDT
  - RENDER/USDT
  - SEI/USDT
  # Mid volatility pool (trailing=2.0%, SL=2.5%, activation=+1.5%)
  - LINK/USDT
  - SOL/USDT
  - AVAX/USDT
  - AAVE/USDT
  - ATOM/USDT
  - NEAR/USDT
  - OP/USDT
  - FIL/USDT
  - ICP/USDT
  # Low volatility pool (trailing=0.9%, SL=2.5%, activation=+2%)
  - BNB/USDT
  - BTC/USDT
  - ETH/USDT

blacklist: []

# Timeframes (v2: sygnały na 4h, daily trend na 1d)
timeframes:
  signal: "4h"
  daily: "1d"

# Pule zmienności — szczegóły (dla referencji, logika w backtest/engine.py POOLS)
pools:
  high_volatility:
    trailing_stop: 0.013       # 1.3%
    stop_loss: 0.025           # 2.5%
    trailing_activation: 0.010 # +1%
    symbols: [INJ/USDT, RENDER/USDT, SEI/USDT]

  mid_volatility:
    trailing_stop: 0.020       # 2.0%
    stop_loss: 0.025           # 2.5%
    trailing_activation: 0.015 # +1.5%
    symbols: [LINK/USDT, SOL/USDT, AVAX/USDT, AAVE/USDT, ATOM/USDT, NEAR/USDT, OP/USDT, FIL/USDT, ICP/USDT]

  low_volatility:
    trailing_stop: 0.009       # 0.9%
    stop_loss: 0.025           # 2.5%
    trailing_activation: 0.020 # +2%
    symbols: [BNB/USDT, BTC/USDT, ETH/USDT]

# Wspólne parametry (v3)
common:
  position_size: 0.20        # 20% wolnego kapitału
  min_position_usdc: 30      # minimum 30 USDC (v3: podniesione z 15)
  max_positions: 8
  max_coin_exposure: 0.15    # 15%
  cooldown_minutes: 12
  commission_pct: 0.00075    # 0.075% per side (Binance maker)
