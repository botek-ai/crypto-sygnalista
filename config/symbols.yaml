# Koszyk walut podzielony na pule zmienności
# TPSL = Trailing Stop Loss

pools:
  high_volatility:
    trailing_stop: 0.013   # 1.3%
    stop_loss: 0.025       # 2.5%
    symbols:
      - INJ/USDT
      - RENDER/USDT
      - SEI/USDT

  mid_volatility:
    trailing_stop: 0.020   # 2.0%
    stop_loss: 0.025       # 2.5%
    trailing_activation: 0.015  # 1.5%
    symbols:
      - LINK/USDT
      - SOL/USDT
      - AVAX/USDT
      - AAVE/USDT
      - ATOM/USDT
      - NEAR/USDT
      - OP/USDT
      - FIL/USDT
      - ICP/USDT

  low_volatility:
    trailing_stop: 0.009   # 0.9%
    stop_loss: 0.025       # 2.5%
    symbols:
      - BNB/USDT
      - BTC/USDT
      - ETH/USDT

# Timeframes do analizy (v2 scoring: sygnały na 4h, wyjścia sprawdzane na 1h)
timeframes:
  signal: "4h"
  daily: "1d"
  
# Wspólne parametry
common:
  position_size: 0.20      # 20% wolnego kapitału
  min_position_usdc: 15    # minimum 15 USDC
  max_positions: 8
  max_coin_exposure: 0.15  # 15%
  cooldown_minutes: 12
  trailing_stop_buy: 0.005 # 0.5%
