# Koszyk walut podzielony na pule zmienności
# Strategia v2 scoring: sygnały na 4h, wyjścia sprawdzane na 1h

# Waluta bazowa — zmień tu żeby przełączyć całą aplikację (np. USDC → USDT)
base_currency: USDC

# Flat watchlist — generowana automatycznie z pul (lub nadpisz ręcznie poniżej)
# Jeśli sekcja "watchlist" jest nieobecna lub pusta, aplikacja zbuduje ją z pools + base_currency

blacklist: []

# Timeframes (v2: sygnały na 4h, daily trend na 1d)
timeframes:
  signal: "4h"
  daily: "1d"

# Pule zmienności — symbole bez pary; aplikacja doda base_currency automatycznie
pools:
  high_volatility:
    trailing_stop: 0.013       # 1.3%
    stop_loss: 0.025           # 2.5%
    trailing_activation: 0.010 # +1%
    symbols: [INJ, RENDER, SEI]

  mid_volatility:
    trailing_stop: 0.020       # 2.0%
    stop_loss: 0.025           # 2.5%
    trailing_activation: 0.015 # +1.5%
    symbols: [LINK, SOL, AVAX, AAVE, ATOM, NEAR, OP, FIL, ICP]

  low_volatility:
    trailing_stop: 0.009       # 0.9%
    stop_loss: 0.025           # 2.5%
    trailing_activation: 0.020 # +2%
    symbols: [BNB, BTC, ETH]

# Wspólne parametry (v3)
common:
  position_size: 0.20        # 20% wolnego kapitału
  min_position_usdc: 30      # minimum 30 USDC (v3: podniesione z 15)
  max_positions: 8
  max_coin_exposure: 0.15    # 15%
  cooldown_minutes: 12
  commission_pct: 0.00075    # 0.075% per side (Binance maker)
